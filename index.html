<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이것만 알면 준호처럼 할 수 있다 - 안티그래비티 교사 연수</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- QRCode.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./css/custom.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden select-none">

  <!-- ========================================================= -->
  <!-- TOP HEADER & PROGRESS BAR -->
  <!-- ========================================================= -->
  <header class="h-16 border-b border-slate-800/80 px-4 md:px-8 flex items-center justify-between glass-panel z-30 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-white shadow-md shadow-indigo-500/20">
        <i data-lucide="sparkles" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-base md:text-lg text-slate-100 tracking-tight flex items-center gap-2">
          <span>이것만 알면 준호처럼 할 수 있다</span>
          <span class="hidden sm:inline-block text-xs px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 font-medium border border-slate-700">안티그래비티 연수</span>
        </h1>
      </div>
    </div>

    <!-- Center Badge -->
    <div id="slide-badge" class="hidden md:inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-800/90 border border-slate-700 text-sm font-bold text-indigo-300">
      🚀 오프닝
    </div>

    <!-- Right Quick Actions -->
    <div class="flex items-center gap-3">
      <!-- High-visibility PDF Export Button -->
      <button onclick="window.exportToPDF()" data-tooltip="강의 자료 PDF로 인쇄/저장 (단축키: Ctrl+P)" class="px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white border border-emerald-400/40 text-xs md:text-sm font-extrabold transition-all flex items-center gap-2 shadow-lg shadow-emerald-500/20 transform hover:scale-105 active:scale-95">
        <i data-lucide="file-down" class="w-4 h-4 text-white"></i>
        <span>📄 PDF 저장</span>
      </button>

      <!-- Agent Insights Button -->
      <button onclick="window.toggleAgentDrawer()" data-tooltip="5인 에이전트 회의록 (단축키: A)" class="px-3.5 py-2 rounded-xl bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/30 text-xs md:text-sm font-bold transition-all flex items-center gap-2">
        <i data-lucide="bot" class="w-4 h-4"></i>
        <span class="hidden sm:inline">에이전트 인사이트</span>
      </button>

      <!-- Presenter Note Button -->
      <button onclick="window.togglePresenterModal()" data-tooltip="강사용 티칭 꿀팁 (단축키: P)" class="px-3.5 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 text-xs md:text-sm font-bold transition-all flex items-center gap-2">
        <i data-lucide="mic" class="w-4 h-4"></i>
        <span class="hidden sm:inline">강사 꿀팁</span>
      </button>

      <!-- Overview Grid Button -->
      <button onclick="window.toggleOverviewModal()" data-tooltip="전체 목차 맵 (단축키: M)" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-all">
        <i data-lucide="layout-grid" class="w-5 h-5"></i>
      </button>

      <!-- Fullscreen Button -->
      <button onclick="window.toggleFullScreen()" data-tooltip="전체화면 (단축키: F / ㄹ)" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-all">
        <i data-lucide="maximize" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- Progress Bar (Thin Top Line) -->
  <div class="w-full bg-slate-900 h-1 z-30 shrink-0">
    <div id="progress-bar" class="h-full bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500 transition-all duration-300 ease-out" style="width: 5.5%;"></div>
  </div>

  <!-- ========================================================= -->
  <!-- FLOATING EDITOR TOOLBAR (고치기 모드 상단 툴바)              -->
  <!-- ========================================================= -->
  <div id="editor-toolbar" class="editor-toolbar no-print hidden">
    <button onclick="window.editorExec('undo')" title="한 걸음 되돌리기 (Undo)" class="editor-btn"><i data-lucide="undo" class="w-4 h-4"></i></button>
    <button onclick="window.editorExec('redo')" title="다시 (Redo)" class="editor-btn"><i data-lucide="redo" class="w-4 h-4"></i></button>
    <div class="editor-separator"></div>
    <button onclick="window.editorChangeFontSize(2)" title="글자 크게" class="editor-btn font-bold">A+</button>
    <button onclick="window.editorChangeFontSize(-2)" title="글자 작게" class="editor-btn font-bold">A-</button>
    <button onclick="window.editorExec('bold')" title="굵게 (Bold)" class="editor-btn font-extrabold">B</button>
    <button onclick="window.editorExec('hiliteColor', '#fef08a')" title="형광펜 (노랑)" class="editor-btn text-amber-300">🖍️</button>
    <div class="editor-separator"></div>
    <button onclick="window.editorExec('foreColor', '#f8fafc')" title="글자색: 기본/흰색" class="editor-btn"><span class="w-3.5 h-3.5 rounded-full bg-slate-100 border border-slate-400 inline-block"></span></button>
    <button onclick="window.editorExec('foreColor', '#f43f5e')" title="글자색: 빨강" class="editor-btn"><span class="w-3.5 h-3.5 rounded-full bg-rose-500 inline-block"></span></button>
    <button onclick="window.editorExec('foreColor', '#38bdf8')" title="글자색: 파랑" class="editor-btn"><span class="w-3.5 h-3.5 rounded-full bg-sky-400 inline-block"></span></button>
    <button onclick="window.editorExec('foreColor', '#34d399')" title="글자색: 초록" class="editor-btn"><span class="w-3.5 h-3.5 rounded-full bg-emerald-400 inline-block"></span></button>
    <div class="editor-separator"></div>
    <button onclick="window.editorExec('justifyCenter')" title="가운데 정렬" class="editor-btn"><i data-lucide="align-center" class="w-4 h-4"></i></button>
    <button onclick="window.editorInsertImage()" title="사진 넣기" class="editor-btn"><i data-lucide="image" class="w-4 h-4"></i></button>
    <div class="editor-separator"></div>
    <button onclick="window.editorHideElement()" title="선택한 부분 지우기 (감추기)" class="editor-btn text-rose-300"><i data-lucide="eye-off" class="w-4 h-4 mr-1"></i>부분 지우기</button>
    <button onclick="window.editorHideSlide()" title="이 장 지우기 (감추기)" class="editor-btn text-rose-400"><i data-lucide="trash-2" class="w-4 h-4 mr-1"></i>이 장 지우기</button>
    <button onclick="window.editorResetSlide()" title="전체 되돌리기 (원본 복원)" class="editor-btn text-amber-300 bg-amber-500/20"><i data-lucide="rotate-ccw" class="w-4 h-4 mr-1"></i>전체 되돌리기</button>
  </div>

  <!-- ========================================================= -->
  <!-- MAIN SLIDE VIEWPORT -->
  <!-- ========================================================= -->
  <main class="flex-1 relative overflow-hidden slide-container px-2 md:px-6 py-2 flex items-center justify-center w-full">
    <div id="slide-viewport" class="w-full max-w-[98vw] 2xl:max-w-[1850px] h-full flex flex-col justify-center">
      <!-- Dynamic Slide Content Injected Here by app.js -->
    </div>
    <!-- Hidden Print Container for Full PDF Generation -->
    <div id="print-container" class="w-full"></div>
  </main>

    <!-- ========================================================= -->
  <!-- BOTTOM CONTROLLER BAR                                     -->
  <!-- ========================================================= -->
  <footer class="h-18 py-3 border-t border-slate-800/80 px-4 md:px-8 flex items-center justify-between glass-panel z-30 shrink-0">
    <!-- Left: PDF Export & Smart Tool Buttons (고치기 / 전체 / 교사용) -->
    <div class="flex items-center gap-2 md:gap-3">
      <button onclick="window.exportToPDF()" class="px-3.5 py-2 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/40 text-xs md:text-sm font-bold transition-all flex items-center gap-1.5 shadow-sm">
        <i data-lucide="file-down" class="w-4 h-4"></i>
        <span>PDF 자료 출력</span>
      </button>

      <div class="h-6 w-[1px] bg-slate-700/80 mx-1 hidden sm:block"></div>

      <!-- Smart Presentation Buttons (Never overlapping with nav buttons) -->
      <button id="btn-toggle-edit" onclick="window.toggleEditMode()" data-tooltip="슬라이드 글자 수정 (✎ 고치기)" class="smart-tool-btn">
        <i data-lucide="edit-3" class="w-4 h-4 text-indigo-400"></i>
        <span>✎ 고치기</span>
      </button>
      <button id="btn-toggle-fullscreen" onclick="window.toggleFullScreen()" data-tooltip="전체화면 (단축키: F / ㄹ)" class="smart-tool-btn">
        <i data-lucide="maximize" class="w-4 h-4 text-sky-400"></i>
        <span>⛶ 전체</span>
      </button>
      <button id="btn-toggle-teacher" onclick="window.toggleTeacherDrawer()" data-tooltip="교사용 지도 팁 (단축키: T / ㅅ)" class="smart-tool-btn">
        <i data-lucide="graduation-cap" class="w-4 h-4 text-amber-400"></i>
        <span>교사용</span>
      </button>
    </div>

    <!-- Center: Shortcuts Guide (Desktop) -->
    <div class="hidden xl:flex items-center gap-2 text-xs font-mono text-slate-400">
      <span class="text-slate-500">단축키:</span>
      <span class="px-2 py-0.5 rounded bg-slate-800/80 border border-slate-700/60 text-slate-300">← / →</span>
      <span class="px-2 py-0.5 rounded bg-slate-800/80 border border-slate-700/60 text-slate-300">F(전체)</span>
      <span class="px-2 py-0.5 rounded bg-slate-800/80 border border-slate-700/60 text-slate-300">T(교사용)</span>
    </div>

    <!-- Right: Navigation Buttons (이전 / 슬라이드 번호 / 다음) -->
    <div class="flex items-center gap-2 md:gap-3">
      <button id="prev-btn" onclick="window.prevSlide()" class="p-2 md:p-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-all hover:scale-105 active:scale-95 shadow-md flex items-center gap-1.5">
        <i data-lucide="chevron-left" class="w-5 h-5 md:w-6 md:h-6"></i>
        <span class="text-xs md:text-sm font-bold pr-1 hidden sm:inline">이전</span>
      </button>

      <span id="slide-counter" class="font-mono font-extrabold text-sm md:text-base text-slate-200 px-3 md:px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 min-w-[80px] md:min-w-[90px] text-center shadow-inner">
        1 / 18
      </span>

      <button id="next-btn" onclick="window.nextSlide()" class="p-2 md:p-3 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-500/30 transition-all hover:scale-105 active:scale-95 flex items-center gap-1.5">
        <span class="text-xs md:text-sm font-bold pl-1 hidden sm:inline">다음</span>
        <i data-lucide="chevron-right" class="w-5 h-5 md:w-6 md:h-6"></i>
      </button>
    </div>
  </footer>

  <!-- ========================================================= -->
  <!-- TEACHER NOTES SLIDING DRAWER (교사용 하단 슬라이딩 서랍)    -->
  <!-- ========================================================= -->
  <div id="teacher-drawer" class="teacher-drawer no-print">
    <div class="max-w-6xl mx-auto p-6">
      <div class="flex items-center justify-between pb-4 border-b border-slate-700/80 mb-4">
        <div class="flex items-center gap-3">
          <div class="p-2 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/30">
            <i data-lucide="graduation-cap" class="w-6 h-6"></i>
          </div>
          <div>
            <span class="text-xs font-bold text-amber-400 uppercase tracking-wider">교사용 지도 가이드 (단축키: T / ㅅ, 닫기: ESC)</span>
            <h3 id="teacher-drawer-title" class="text-lg md:text-xl font-extrabold text-white">Slide 1: 오프닝</h3>
          </div>
        </div>
        <button onclick="window.toggleTeacherDrawer()" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <div id="teacher-drawer-content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Injected via app.js -->
      </div>
    </div>
  </div>

  <!-- ========================================================= -->
  <!-- AGENT INSIGHTS RIGHT DRAWER (5-AGENT TEAM INSIGHTS) -->
  <!-- ========================================================= -->
  <aside id="agent-drawer" class="fixed inset-y-0 right-0 w-80 md:w-96 glass-panel border-l border-slate-700 p-5 shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-50 flex flex-col justify-between overflow-y-auto">
    <div>
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <div class="p-1.5 rounded-lg bg-indigo-500 text-white"><i data-lucide="users" class="w-4 h-4"></i></div>
          <h3 class="font-bold text-slate-100 text-sm">5인 에이전트 협업 인사이트</h3>
        </div>
        <button onclick="window.toggleAgentDrawer()" class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="agent-drawer-content" class="space-y-4">
        <!-- Injected via app.js -->
      </div>
    </div>

    <div class="mt-6 pt-4 border-t border-slate-700 text-center">
      <span class="text-[11px] text-slate-400">Google Antigravity Multi-Agent Workflow Engine</span>
    </div>
  </aside>

  <!-- ========================================================= -->
  <!-- PRESENTER GUIDE MODAL (TEACHING TIPS & SCRIPTS) -->
  <!-- ========================================================= -->
  <div id="presenter-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-panel border border-amber-500/40 rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative animate-in fade-in zoom-in-95 duration-200">
      <button onclick="window.togglePresenterModal()" class="absolute top-4 right-4 p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      
      <div id="presenter-note-content">
        <!-- Injected via app.js -->
      </div>

      <div class="mt-6 flex justify-end">
        <button onclick="window.togglePresenterModal()" class="px-5 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs transition-all">
          확인하고 닫기
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================================= -->
  <!-- OVERVIEW GRID MODAL (TABLE OF CONTENTS) -->
  <!-- ========================================================= -->
  <div id="overview-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 md:p-8 hidden">
    <div class="glass-panel border border-slate-700 rounded-3xl max-w-5xl w-full max-h-[85vh] p-6 shadow-2xl flex flex-col justify-between">
      <div class="flex items-center justify-between pb-4 border-b border-slate-700 shrink-0">
        <div class="flex items-center gap-3">
          <div class="p-2 rounded-xl bg-indigo-500/20 text-indigo-400"><i data-lucide="map" class="w-5 h-5"></i></div>
          <h3 id="overview-modal-title" class="font-extrabold text-lg text-slate-100">전체 강의 슬라이드 목차</h3>
        </div>
        <button onclick="window.toggleOverviewModal()" class="p-1.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="overview-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 py-6 overflow-y-auto pr-1">
        <!-- Injected via app.js -->
      </div>

      <div class="pt-4 border-t border-slate-700 flex justify-between items-center text-xs text-slate-400 shrink-0">
        <span>원하는 슬라이드를 클릭하면 해당 장표로 즉시 점프합니다.</span>
        <button onclick="window.toggleOverviewModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold transition-all">
          닫기 (ESC)
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./js/slides-data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
