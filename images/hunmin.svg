<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="hanjiOld" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#faf5ea" />
      <stop offset="70%" stop-color="#eedfc3" />
      <stop offset="100%" stop-color="#dcc59f" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#hanjiOld)" stroke="#785d3f" stroke-width="4"/>
  <rect x="15" y="15" width="570" height="370" rx="8" fill="none" stroke="#997b56" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Red Royal Seal Stamp -->
  <rect x="510" y="25" width="55" height="55" rx="4" fill="#b91c1c" fill-opacity="0.85" />
  <text x="537" y="48" font-family="'Pretendard', sans-serif" font-size="13" font-weight="900" fill="#fef2f2" text-anchor="middle">朝鮮</text>
  <text x="537" y="68" font-family="'Pretendard', sans-serif" font-size="13" font-weight="900" fill="#fef2f2" text-anchor="middle">國寶</text>

  <!-- Title Badge -->
  <g transform="translate(30, 30)">
    <rect width="240" height="36" rx="8" fill="#3c2415" />
    <text x="120" y="24" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" fill="#fef3c7" text-anchor="middle">훈민정음 해례본 (訓民正音)</text>
  </g>

  <!-- Main Woodblock Text Columns -->
  <g transform="translate(60, 100)" font-family="'Batang', 'Pretendard', serif" font-weight="900" font-size="26" fill="#1c1917" letter-spacing="4">
    <text x="400" y="40">國之語音</text>
    <text x="400" y="90">異乎中國</text>
    <text x="400" y="140">與文字不</text>
    <text x="400" y="190">相流通故</text>

    <text x="280" y="40">愚民有所</text>
    <text x="280" y="90">欲言而終</text>
    <text x="280" y="140">不得伸其</text>
    <text x="280" y="190">情者多矣</text>

    <text x="160" y="40">予爲此憫</text>
    <text x="160" y="90">然新制二</text>
    <text x="160" y="140">十八字欲</text>
    <text x="160" y="190">使人人易</text>

    <text x="40" y="40">習便於日</text>
    <text x="40" y="90">用耳</text>
  </g>

  <!-- Bottom Info -->
  <g transform="translate(140, 345)">
    <rect width="320" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" />
    <text x="160" y="22" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">
      세종대왕 1446년 반포 <tspan fill="#38bdf8" font-weight="800">(유네스코 세계기록유산)</tspan>
    </text>
  </g>
</svg>