<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>안티그래비티 인트로</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; inset: 0; margin: auto; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; }
  #play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 18px 36px; font: 700 24px Pretendard, sans-serif;
          border: 0; border-radius: 999px; background: #4f8cff; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<button id="play">▶ 재생</button>
<audio id="aud" src="audio/intro_mix.wav" preload="auto"></audio>
<script src="timeline.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1920, H = 1080;

// ─── 타이밍: 음성 분석 결과(timeline.js) 기준 ───
const OFF = 1.0, OUTRO = 3.4;              // 내레이션 전 오프닝, 끝 엔딩카드 길이
const TL = window.TIMELINE;
const SC = TL.scenes.map(s => ({ a: s.start + OFF, b: s.end + OFF, p: s.phrases.map(q => [q[0] + OFF, q[1] + OFF]) }));
const END = TL.duration + OFF, TOTAL = END + OUTRO;
const nextA = i => i < SC.length - 1 ? SC[i + 1].a : END;

const LINES = [
  ['수업에 쓸 퀴즈 앱이 필요했어요.', '그래서 재미나이에게 물었죠.'],
  ['돌아온 건 긴 코드 한 뭉치.', '어디에 붙여야 하지?', '왜 안 되지?', '대답은 해주지만,', '만들어주지는 않았어요.'],
  ['안티그래비티는 달라요.', '말로 부탁하면, 에이전트가 직접 파일을 만들고,', '실행해 보고,', '오류까지 스스로 고칩니다.'],
  ['그러니 선생님이 코딩을 배울 필요는 없어요.', '코드는 AI가 씁니다.'],
  ['대신 AI가 절대 대신할 수 없는 게 있죠.', '이 개념을 아이들이 어디서 헷갈리는지,', '어떤 순서로,', '어떤 활동으로 가르쳐야 하는지.', '바로 선생님의 PCK,', '교수내용지식입니다.'],
  ['무엇을 만들지는 선생님이,', '어떻게 만들지는 안티그래비티가.', '코딩보다 수업을 아는 선생님이,', '가장 좋은 앱을 만듭니다.'],
];

const C = { bg: '#060914', blue: '#4f8cff', violet: '#9b5cff', cyan: '#2de2e6', pink: '#ff4d8d', red: '#ff3b4e',
            gold: '#ffc83d', white: '#f4f6ff', dim: '#8a93b8', green: '#3ddc97' };
const FONT = '"Pretendard","Malgun Gothic",sans-serif';
const EMOJI = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const MONO = 'Consolas,"Courier New",monospace';
const AG = [C.blue, C.violet, C.cyan];

// 강조 타이밍 (카메라 흔들림 + 효과음)
const S2 = SC[1].p, S3 = SC[2].p, S4 = SC[3].p, S5 = SC[4].p, S6 = SC[5].p;
const PCK_SLAM = S5[4][0] + 0.3, STAMP = S2[4][0] + 0.35, STRIKE = S4[0][0] + 1.3;
const NODE_T = [S3[1][0], S3[1][0] + 1.1, S3[2][0], S3[3][0]];
const HITS = [[0.02, 1], [SC[2].a + 0.1, 1], [S2[2][0], 0.9], [STAMP, 1.2], [STRIKE, 0.8], [PCK_SLAM, 1.8], [S6[3][0] + 0.4, 0.7], [END, 1.2]];
window.SFX = [
  [0, 'boom'], ...SC.slice(1).map(s => [s.a - 0.3, 'whoosh']), [END - 0.3, 'whoosh'],
  [SC[2].a + 0.1, 'rise'], [S2[2][0], 'glitch'], [STAMP, 'stamp'], [STRIKE, 'stamp'],
  ...NODE_T.map(t => [t, 'pop']), [S5[1][0], 'pop'], [S5[2][0], 'pop'], [S5[3][0], 'pop'],
  [PCK_SLAM, 'boom'], [S6[3][0] + 0.4, 'sparkle'], [END, 'boom'],
];
window.TOTAL = TOTAL;

// ─── 수학 도우미 ───
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, d) => clamp((t - a) / d);
const oCubic = x => 1 - Math.pow(1 - x, 3);
const iCubic = x => x * x * x;
const oExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const ioCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const oBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };

// ─── 그리기 도우미 ───
function grad(x0, x1, cols) { const g = ctx.createLinearGradient(x0, 0, x1, 0); cols.forEach((c, i) => g.addColorStop(i / (cols.length - 1), c)); return g; }

function T(s, x, y, size, color, o = {}) {
  ctx.save();
  ctx.font = `${o.w || 800} ${size}px ${o.emoji ? EMOJI : (o.mono ? MONO : FONT)}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  ctx.letterSpacing = (o.ls ?? (o.emoji ? 0 : -0.02 * size)) + 'px';
  ctx.globalAlpha *= o.a ?? 1;
  if (o.glow) { ctx.shadowColor = o.glowColor || color; ctx.shadowBlur = o.glow; }
  if (o.grad) { const w = ctx.measureText(s).width; const x0 = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2; ctx.fillStyle = grad(x0, x0 + w, o.grad); }
  else ctx.fillStyle = color;
  ctx.fillText(s, x, y);
  ctx.restore();
}

// 글자 하나씩 튀어오르는 키네틱 타이포
function K(s, x, y, size, color, t0, t, o = {}) {
  if (t < t0) return;
  const ko = o.out != null ? P(t, o.out, 0.25) : 0;
  if (ko >= 1) return;
  ctx.save();
  ctx.font = `${o.w || 900} ${size}px ${FONT}`;
  const ls = o.ls ?? -0.03 * size; ctx.letterSpacing = ls + 'px';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const chars = [...s], total = ctx.measureText(s).width;
  const x0 = o.align === 'left' ? x : x - total / 2;
  const st = o.stagger ?? 0.03;
  chars.forEach((ch, i) => {
    const k = P(t, t0 + i * st, o.dur || 0.42);
    if (k <= 0 || ch === ' ') return;
    const e = oBack(k), cx = x0 + ctx.measureText(chars.slice(0, i).join('')).width, cw = ctx.measureText(ch).width;
    ctx.save();
    ctx.globalAlpha *= clamp(k * 2.5) * (1 - ko) * (o.a ?? 1);
    ctx.translate(cx + cw / 2, y + (1 - e) * size * 0.55 - oCubic(ko) * size * 0.5);
    ctx.rotate((1 - e) * (o.rot ?? 0.2));
    const sc = lerp(.5, 1, e); ctx.scale(sc, sc);
    if (o.glow) { ctx.shadowColor = o.glowColor || C.blue; ctx.shadowBlur = o.glow; }
    ctx.fillStyle = o.grad ? grad(x0 - cx - cw / 2, x0 + total - cx - cw / 2, o.grad) : color;
    ctx.fillText(ch, -cw / 2, 0);
    ctx.restore();
  });
  ctx.restore();
}

function rr(x, y, w, h, r, fill, stroke, lw = 3) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function circle(x, y, r, fill, stroke, lw = 3) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function pop(t, t0, d = 0.45) { return oBack(P(t, t0, d)); }

// ─── 배경 ───
const R = rng(7);
const PARTS = Array.from({ length: 170 }, () => ({ x: R() * W, y: R() * H, s: R() * 2.6 + 0.6, v: R() * 140 + 40, ph: R() * 6.28, c: [C.blue, C.violet, C.cyan][Math.floor(R() * 3)] }));
// 중력 반전: 3장면에서 입자가 떨어지다가 떠오름 (속도 적분)
function G(t) { const a = SC[2].a - 0.3, d = 1.2; if (t < a) return t; if (t < a + d) { const s = t - a; return a + s - s * s / d; } return a - (t - a - d); }
const TINTS = [C.blue, C.red, C.violet, C.blue, C.gold, C.cyan];
function tintAt(t) {
  let i = 0; for (let k = 0; k < SC.length; k++) if (t >= SC[k].a - 0.2) i = k;
  if (t >= END) return mix(TINTS[5], C.violet, P(t, END, 0.6));
  const prev = i ? TINTS[i - 1] : C.blue; return mix(prev, TINTS[i], P(t, SC[i].a - 0.2, 0.6));
}
function mix(a, b, k) { const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  const c = [16, 8, 0].map(s => Math.round(lerp(x >> s & 255, y >> s & 255, k))); return `#${c.map(v => v.toString(16).padStart(2, '0')).join('')}`; }

function background(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const tint = tintAt(t);
  for (let k = 0; k < 3; k++) {
    const x = W * (0.15 + 0.7 * (Math.sin(t * 0.35 + k * 2.1) + 1) / 2), y = H * (0.25 + 0.5 * (Math.cos(t * 0.27 + k * 1.7) + 1) / 2);
    const g = ctx.createRadialGradient(x, y, 0, x, y, 760);
    g.addColorStop(0, hex(k === 1 ? C.violet : tint, 0.2)); g.addColorStop(1, hex(tint, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  // 흐르는 그리드
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.035)'; ctx.lineWidth = 1;
  const off = (t * 40) % 80;
  for (let x = -80 + off; x < W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = -80 + off; y < H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  // 입자
  const g = G(t);
  PARTS.forEach(p => {
    const y = ((p.y + g * p.v) % (H + 40) + H + 40) % (H + 40) - 20;
    const x = p.x + Math.sin(t * 0.8 + p.ph) * 18;
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 2 + p.ph);
    circle(x, y, p.s, p.c);
  });
  ctx.globalAlpha = 1;
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// ─── 카메라 ───
function camera(t) {
  let sx = 0, sy = 0, z = 1;
  HITS.forEach(([h, s]) => { if (t < h) return; const d = t - h, e = Math.exp(-d * 7) * s;
    sx += Math.sin(d * 70) * 22 * e; sy += Math.cos(d * 55) * 16 * e; z += 0.045 * s * Math.exp(-d * 5); });
  z += 0.012 * Math.sin(t * 0.6);                   // 은은한 숨쉬기 줌
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
}

// 장면 래퍼: 들어올 때 페이드, 나갈 때 줌 스루
function scene(i, t, fn) {
  const a = SC[i].a, b = nextA(i);
  if (t < a - 0.02 || t > b) return;
  const out = P(t, b - 0.22, 0.22);
  ctx.save();
  ctx.globalAlpha = P(t, a - 0.02, 0.15) * (1 - out);
  const s = 1 + 0.22 * out * out;
  ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2);
  fn(t, SC[i].p);
  ctx.restore();
}

// 장면 전환 대각선 스와이프
function transitions(t) {
  const cuts = [...SC.slice(1).map(s => s.a), END];
  cuts.forEach((a, n) => {
    const q = P(t, a - 0.32, 0.64); if (q <= 0 || q >= 1) return;
    const cols = [C.blue, C.violet, C.cyan, C.pink];
    ctx.save(); ctx.transform(1, 0, -0.45, 1, 0, 0);
    for (let k = 0; k < 4; k++) {
      const e = ioCubic(clamp((q - k * 0.06) / 0.76));
      const x = lerp(-700, W + 1200, e);
      ctx.fillStyle = hex(cols[(k + n) % 4], 0.9); ctx.fillRect(x + k * 130, 0, 110 + k * 30, H);
    }
    ctx.restore();
    const f = 1 - Math.abs(q - 0.5) * 4; if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${f * 0.18})`; ctx.fillRect(0, 0, W, H); }
  });
}

// 하단 자막
function subtitle(t) {
  let cur = null;
  SC.forEach((s, i) => s.p.forEach(([a, b], j) => { if (t >= a - 0.05 && t <= b + 0.1) cur = { s: LINES[i][j], a, b }; }));
  if (!cur) return;
  const al = P(t, cur.a - 0.05, 0.08) * (1 - P(t, cur.b + 0.02, 0.08));
  ctx.save(); ctx.globalAlpha = al;
  ctx.font = `700 38px ${FONT}`; ctx.letterSpacing = '-0.5px';
  const w = ctx.measureText(cur.s).width + 64;
  rr(W / 2 - w / 2, 968, w, 66, 33, 'rgba(5,8,20,0.72)', 'rgba(255,255,255,0.10)', 2);
  T(cur.s, W / 2, 1002, 38, C.white, { w: 700, ls: -0.5 });
  ctx.restore();
}

// ─── 인트로 (0 ~ 1초) ───
function intro(t) {
  if (t > OFF + 0.2) return;
  const al = 1 - P(t, OFF - 0.15, 0.3);
  ctx.save(); ctx.globalAlpha = al;
  ctx.translate(W / 2, H / 2);
  for (let k = 0; k < 28; k++) {
    const ang = k / 28 * Math.PI * 2 + t * 0.4, e = oExpo(P(t, 0, 0.7));
    ctx.strokeStyle = hex(AG[k % 3], 0.7 * (1 - P(t, 0.3, 0.6))); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(Math.cos(ang) * 120 * e, Math.sin(ang) * 120 * e); ctx.lineTo(Math.cos(ang) * 1100 * e, Math.sin(ang) * 1100 * e); ctx.stroke();
  }
  ctx.rotate((1 - oExpo(P(t, 0, 0.6))) * 3);
  const s = oBack(P(t, 0, 0.5)); ctx.scale(s, s);
  T('✦', 0, -40, 200, C.white, { w: 900, grad: AG, glow: 50, glowColor: C.blue, ls: 0 });
  ctx.restore();
  ctx.save(); ctx.globalAlpha = al;
  T('TEACHER × AI', W / 2, H / 2 + 120, 44, C.white, { w: 800, ls: 14, a: P(t, 0.2, 0.3) });
  ctx.restore();
  const f = 1 - P(t, 0, 0.3); if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${f})`; ctx.fillRect(0, 0, W, H); }
}

// ─── 장면 1: 늦은 밤, 재미나이에게 묻다 ───
function bubble(x, y, text, align, fill, color, size = 34) {
  ctx.save(); ctx.font = `700 ${size}px ${FONT}`; ctx.letterSpacing = '-0.5px';
  const w = Math.max(ctx.measureText(text).width, 20) + 56, h = size + 40, x0 = align === 'right' ? x - w : x;
  rr(x0, y - h / 2, w, h, h / 2, fill);
  T(text, x0 + 28, y + 1, size, color, { w: 700, align: 'left', ls: -0.5 });
  ctx.restore();
}
function scene1(t, p) {
  // 달
  ctx.save(); ctx.globalAlpha *= P(t, p[0][0], 0.5);
  circle(1660, 170, 62, C.gold); ctx.shadowBlur = 0; circle(1690, 150, 58, C.bg);
  ctx.restore();
  K('퀴즈 앱이 필요해!', 960, 140, 96, C.white, p[0][0] + 0.05, t, { out: p[1][0] - 0.2 });
  K('재미나이에게 물었다', 960, 140, 96, C.white, p[1][0], t, { grad: [C.blue, C.violet] });

  const e = oBack(P(t, p[0][0], 0.6)), mw = 1040, mh = 600;
  ctx.save(); ctx.translate(960, 590); ctx.scale(e, e); ctx.rotate((1 - e) * -0.12);
  ctx.shadowColor = hex(C.blue, 0.35); ctx.shadowBlur = 60;
  rr(-mw / 2, -mh / 2, mw, mh, 30, '#0e1328', 'rgba(255,255,255,0.14)');
  ctx.shadowBlur = 0;
  [C.red, C.gold, C.green].forEach((c, i) => circle(-mw / 2 + 40 + i * 30, -mh / 2 + 34, 9, c));
  T('PM 11:47', mw / 2 - 40, -mh / 2 + 34, 26, C.dim, { align: 'right', w: 600, ls: 1 });
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(-mw / 2, -mh / 2 + 66, mw, 2);

  const msg = '수업에 쓸 퀴즈 앱 만들어줘!', chars = [...msg];
  const n = Math.floor(P(t, p[0][0] + 0.3, 1.1) * chars.length);
  if (n > 0) bubble(mw / 2 - 50, -150, chars.slice(0, n).join('') + (n < chars.length ? '▍' : ''), 'right', C.blue, '#fff');

  if (t > p[1][0]) {
    const k = pop(t, p[1][0], 0.4);
    ctx.save(); ctx.translate(-mw / 2 + 50, 0); ctx.scale(k, k);
    T('✦ 재미나이', 0, -40, 28, C.cyan, { align: 'left', w: 800 });
    if (t < p[1][0] + 0.9) {
      rr(0, 0, 150, 74, 37, '#1c2446');
      for (let d = 0; d < 3; d++) circle(45 + d * 30, 37 - Math.max(0, Math.sin((t * 8) - d * 0.8)) * 10, 8, C.white);
    } else {
      const code = ['<!DOCTYPE html>', '<script> const quiz = [ ...', 'function check(a) { ... }'];
      code.forEach((c, i) => { const kk = P(t, p[1][0] + 0.9 + i * 0.15, 0.2);
        rr(0, i * 64, 620, 54, 14, hex('#1c2446', kk)); T(c, 24, i * 64 + 28, 26, hex(C.white, kk), { align: 'left', mono: true, w: 500, ls: 0 }); });
    }
    ctx.restore();
  }
  ctx.restore();
}

// ─── 장면 2: 코드 폭탄과 오류 ───
const CODE = ['function checkAnswer(q, a) {', '  const score = quiz.map(x => x.ok);', "document.querySelector('#quiz')", '}); // TODO: fix', "import React from 'react';",
  '<div class="quiz-card">', '  if (answer === correct) {', "fetch('/api/score', { method: 'POST' })", 'export default function App() {', '  const [idx, setIdx] = useState(0);',
  'npm install && npm run dev', '<\/script>', '    score += 10;', 'let timer = setInterval(tick, 1000);', '.quiz-card { display: grid; }', '  return <Question data={q} />;'];
const ERRS = ['Uncaught SyntaxError: Unexpected token', "ReferenceError: quiz is not defined", '404 Not Found: /api/score', "TypeError: Cannot read 'map'",
  "Module not found: 'react'", 'npm ERR! code ENOENT', 'Uncaught (in promise) Error'];
const R2 = rng(21);
const QMARKS = Array.from({ length: 10 }, (_, i) => ({ x: 160 + R2() * 1600, y: 160 + R2() * 700, s: 110 + R2() * 170, r: (R2() - .5) * 0.8, d: i * 0.05 }));
const EWIN = ERRS.map((e, i) => ({ e, x: 120 + R2() * 1180, y: 120 + R2() * 640, d: i * 0.07 }));
function codeRain(t, alpha, speed = 320) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `500 22px ${MONO}`; ctx.fillStyle = C.cyan; ctx.textBaseline = 'middle';
  for (let c = 0; c < 9; c++) for (let r = 0; r < 34; r++) {
    const y = ((r * 38 - t * speed * (0.7 + (c % 3) * 0.2)) % (34 * 38) + 34 * 38) % (34 * 38) - 40;
    ctx.fillText(CODE[(r * 7 + c * 3) % CODE.length], c * 225 - 40, y);
  }
  ctx.restore();
}
function scene2(t, p) {
  codeRain(t, t < p[1][0] ? 0.22 : 0.1);
  // P0: 끝없이 늘어나는 코드 말풍선
  if (t < p[2][0]) {
    const k = pop(t, p[0][0], 0.5), grow = ioCubic(P(t, p[0][0] + 0.2, 1.6));

function draw(t) {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  background(t);
  ctx.save(); camera(t);
  intro(t);
  scene(0, t, scene1); scene(1, t, scene2); scene(2, t, scene3);
  scene(3, t, scene4); scene(4, t, scene5); scene(5, t, scene6);
  outro(t);
  ctx.restore();
  transitions(t);
  subtitle(t);
  const fo = P(t, TOTAL - 0.5, 0.5); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

// ─── 실행: 렌더 모드(?render) / 미리보기 모드 ───
const params = new URLSearchParams(location.search);
window.renderAt = t => { draw(t); return cv.toDataURL('image/jpeg', 0.93); };
window.READY = Promise.all(['600', '700', '800', '900'].map(w => document.fonts.load(`${w} 100px Pretendard`, '가A'))).catch(() => {});
const btn = document.getElementById('play'), aud = document.getElementById('aud');
if (params.has('render')) btn.remove();
window.READY.then(() => draw(params.has('t') ? +params.get('t') : 0));
btn.onclick = () => {
  btn.style.display = 'none'; aud.currentTime = 0; aud.play();
  const loop = () => { draw(aud.currentTime); if (!aud.ended) requestAnimationFrame(loop); else btn.style.display = ''; };
  loop();
};
</script>
